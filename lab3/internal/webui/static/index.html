<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Места · Places</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script src="/background.js" defer></script><script src="/app.js" defer></script></head>
<body>
<canvas id="background" aria-hidden="true"></canvas>
<header class="topbar"><a href="/" class="brand" data-i18n="brand">Места</a><div class="header-controls"><button id="motion-toggle" type="button" aria-pressed="false" data-i18n="pauseMotion">Пауза фона</button><label class="language"><span data-i18n="language">Язык</span><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label></div></header>
<main>
<section class="search-panel" aria-labelledby="search-title"><h2 id="search-title" class="eyebrow" data-i18n="searchTitle">01 / ВЫБЕРИТЕ ОТПРАВНУЮ ТОЧКУ</h2><form id="search-form"><label class="sr-only" for="query" data-i18n="queryLabel">Город, улица или место</label><div class="search-row"><span aria-hidden="true" class="search-icon">⌕</span><input id="query" type="search" required maxlength="150" placeholder="Например, Kichijoji или Новосибирск" autocomplete="off"><button class="primary" id="search-button" type="submit" data-i18n="search">Найти место →</button></div><div class="type-row"><label for="place-type" data-i18n="placeType">Тип места (необязательно)</label><input id="place-type" list="place-types" maxlength="64" placeholder="Автобусная остановка, музей, парк"><datalist id="place-types"></datalist><p data-i18n="typeHint">Оставьте пустым для обычного поиска.</p></div><div class="options"><label><span data-i18n="radius">Радиус, м</span><input id="radius" type="number" min="10" max="10000" value="3000" required></label><label><span data-i18n="limit">Мест в отчёте</span><input id="limit" type="number" min="1" max="10" value="5" required></label></div></form></section>
<div class="status-row"><p id="status" role="status" aria-live="polite"></p><button id="cancel" class="text-button" hidden data-i18n="cancel">Отменить</button></div>
<section id="error-panel" class="error-panel" role="alert" hidden><strong data-i18n="errorTitle">Не получилось загрузить данные</strong><p id="error-text"></p><button id="retry" class="text-button" data-i18n="retry">Попробовать снова</button></section>
<section id="locations" hidden aria-labelledby="locations-title"><div class="section-heading"><h2 id="locations-title" data-i18n="choose">Какая из этих точек ваша?</h2><span id="location-count" class="badge"></span></div><div id="location-list" class="location-list"></div></section>
<section id="report" hidden aria-labelledby="report-title" tabindex="-1"></section>
<div id="empty-state"></div>
<footer><span><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> / <a href="https://www.graphhopper.com/" target="_blank" rel="noopener">GraphHopper</a> · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · <a href="https://opentripmap.com/" target="_blank" rel="noopener">OpenTripMap</a> · <a href="https://www.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a></span></footer>
</main></body></html>
